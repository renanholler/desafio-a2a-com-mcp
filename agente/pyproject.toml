[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "central-de-salas-agente"
version = "1.0.0"
description = "Agente A2A v1.0 que e host MCP do servidor de salas. Sem LLM."
requires-python = ">=3.10"
dependencies = [
    "mcp==2.3.0",
    "mcp-types==2.3.0",
    "starlette==1.10.0",
    "uvicorn==0.54.0",
]

[tool.setuptools]
py-modules = ["agente"]
