[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "central-de-salas-servidor-mcp"
version = "1.0.0"
description = "Servidor MCP Streamable HTTP da Central de Salas, com MRTR na reserva."
requires-python = ">=3.10"
dependencies = [
    "mcp==2.3.0",
    "pydantic==2.14.1",
    "uvicorn==0.54.0",
]

[tool.setuptools]
py-modules = ["servidor"]
